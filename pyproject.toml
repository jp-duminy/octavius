[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octavius"
dynamic = ["version"]
description = "Simulation analysis toolkit for SPH codes with built-in galaxy finding."
requires-python = ">=3.14"
authors = [
    {name = "JP Duminy", email = "jp@duminy.org"},
]
maintainers = [
    {name = "JP Duminy", email = "jp@duminy.org"},
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENCE"]

dependencies = [
    "numpy>=2.4",
    "scipy>=1.18",
    "astropy>=8.0",
    "h5py>=3.16",
    "numba>=0.65",
    "mpi4py>=4.0"
]

keywords = ["astrophysics", "cosmology", "simulation", 
            "galaxy", "halo", "sph", 
            "fof", "analysis", "hdf5",
            "ahf", "swift", "gizmo",
            "hbt", "eagle", "colibre",
            "kiara",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]

[project.optional-dependencies]
photometry = [
    "fsps>=0.5.0",
]
test = [
    "pytest>=8.0", 
    "pytest-cov>=5.0",
    "memray>=1.19.1",
    "psutil>=7.2.2",
]
dev = [
    "pre-commit>=4.6.0",
    "ruff==0.15.20"
]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

[project.scripts]
octavius = "octavius.run_octavius:main"

[project.urls]
Repository = "https://github.com/jp-duminy/octavius"
Documentation = "https://octavius.readthedocs.io/"

[tool.setuptools.packages.find]
include = ["octavius*"]
[tool.setuptools.package-data]
octavius = ["*.yaml"]
[tool.setuptools.dynamic]
version = {attr = "octavius.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--tb=short", "-q"]
strict_markers = true
markers = [
    "slow: long-running tests (not run in CI)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:numba",
    "ignore::DeprecationWarning:h5py",
]
[tool.coverage.report]
exclude_lines = [
    "@njit",
    "@njit\\(.*\\)",
]

omit = [
    "octavius/external_halo_sources/ahf.py",
    "octavius/external_halo_sources/hbt_herons.py",
    "octavius/photometry/photometry_tables.py",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]